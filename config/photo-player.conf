# ============================================================================
# photo-player.conf — Photo Player 默认配置文件
# ============================================================================
# 用途：
#   为 bin/photo-player 提供默认启动参数。KUAL 菜单（menu.json）的 params
#   或命令行直接调用时的选项可以覆盖这里的设置。
#
# 语法（与 src/config.c 的解析约定一致）：
#   - 每行一个 KEY=VALUE（等号两边不加空格）
#   - 以 # 开头的行是注释，空行忽略
#   - 值区分大小写；枚举值非法时程序报错退出
#
# 覆盖优先级：
#   命令行 CLI / KUAL params  >  本配置文件  >  程序内置默认
#   例：本文件 INTERVAL=60，菜单传 --interval 30，则实际间隔 30 秒。
#
# 键说明：
#   SOURCE        图片源。本地目录路径（M1/M2），或 http://host[:port]/path
#                 形式的 URL（M3）。留空且 CLI 未给 --source 时启动报错
#                 （本文件已给默认值，通常无需改动）。
#   ORDER         播放顺序：seq（顺序）| random（随机，一轮内不重复）。
#   INTERVAL      切图间隔秒数，合法范围 [2, 86400]。
#   START_DELAY   启动延迟（毫秒 [0, 60000]，0 = 不延迟）。等 KUAL/启动器
#                 界面重绘完再上屏，避免按钮残影盖住照片；默认 2000。
#   FIT           缩放策略：contain（等比适配）| cover（等比裁剪铺满）
#                 | stretch（拉伸）。
#   STATUSBAR     状态栏处理：cover（全屏含状态栏区域）| keep（保留状态栏）。
#   FLASH_EVERY   每 N 张做一次闪烁全刷防残影（0 = 关闭）。
#   MAX_FILE_MB   单张图片大小上限（MB，0 = 不限制）。超限文件不入列表，
#                 防超大/渐进式 JPEG 解码 OOM；默认 8。
#   NO_FRAMEWORK  播放期间 stop framework（1 = 开，0 = 关）。激进防干扰，
#                 退出时会 start framework 恢复；默认关闭。
#   TOUCH_EXIT    轻触屏幕退出（1 = 开，0 = 关）。
#   POWER_EXIT    电源键退出（1 = 开，0 = 关）。与 TOUCH_EXIT 互相独立。
#   HTTP_URL      【M3 预留】网络图片源基础 URL（协议 ?count=1 / ?index=N）。
# ============================================================================

# 图片源：本地目录路径，或 http:// URL。
# 默认值 /mnt/us/photos；CLI --source / KUAL params 可覆盖（优先级见上）。
SOURCE=/mnt/us/photos

# 播放顺序：seq | random
ORDER=seq

# 切图间隔秒数 [2, 86400]。相册场景 10 分钟一换
# （二进制内置默认 60 不动，conf 覆盖为 600）
INTERVAL=600

# 启动延迟毫秒 [0, 60000]（0 = 不延迟）：等 KUAL 界面重绘完再上屏，防按钮残影
START_DELAY=2000

# 缩放策略：contain | cover | stretch
FIT=contain

# 状态栏：cover | keep
STATUSBAR=cover

# 每 N 张全刷一次防残影（0 = 关闭）
FLASH_EVERY=8

# 单张图片大小上限 MB（0 = 不限制；超限的不入列表，防渐进式 JPEG OOM）
MAX_FILE_MB=8

# 播放期间 stop framework（1 = 开，0 = 关）
NO_FRAMEWORK=0

# 轻触屏幕退出（1 = 开，0 = 关）
TOUCH_EXIT=1

# 电源键退出（1 = 开，0 = 关），与 TOUCH_EXIT 独立开关
POWER_EXIT=1

# 【M3 预留】网络图片源基础 URL（协议 ?count=1 / ?index=N）
HTTP_URL=